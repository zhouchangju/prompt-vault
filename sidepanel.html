<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prompt Vault</title>
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="panel-header">
    <div class="brand-mini">
      <img src="icons/icon32.png" alt="" />
      <strong>Prompt Vault</strong>
    </div>
    <button id="panelNewPrompt" title="新建提示词" aria-label="新建提示词"><svg class="plus-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="panelShortcutsHelp" title="键盘快捷键" aria-label="键盘快捷键">?</button>
    <button aria-label="打开管理页" id="openManager" title="打开管理页并收起侧栏">↗</button>
  </header>

  <div class="search-box">
    <span>⌕</span>
    <input aria-label="搜索提示词" id="panelSearch" type="search" placeholder="搜索提示词…" autofocus />
    <button id="panelClearSearch" class="hidden" aria-label="清空搜索">×</button>
  </div>


  <div class="panel-workspace">
    <nav id="panelFolderNav" aria-label="提示词分类"></nav>
    <main id="panelResults">
      <p id="panelResultCount" role="status"></p>
      <div id="panelList" class="panel-list"></div>
      <button id="panelLoadMore" class="item-copy hidden">加载更多</button>
      <div id="panelEmpty" class="panel-empty hidden">没有匹配的提示词</div>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="panelVariableBackdrop">
    <section class="variable-card" role="dialog" aria-modal="true" aria-labelledby="panelVariableTitle">
      <header><strong id="panelVariableTitle">填写变量</strong><button aria-label="关闭" id="closePanelVariable">×</button></header>
      <form id="panelVariableForm"></form>
      <footer><button id="panelVariableSubmit" type="submit" form="panelVariableForm">生成并复制</button></footer>
    </section>
  </div>

  <div role="status" aria-live="polite" id="panelToast" class="panel-toast hidden"></div>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
